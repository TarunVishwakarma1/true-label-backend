[package]
name = "truelabel-backend"
version = "0.0.1"
edition = "2024"
description = "TrueLabel - Open-source barcode scanner with crowdsourced nutrition database"
repository = "https://github.com/TarunVishwakarma1/true-lable"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9" }
dotenvy = "0.15.7"
redis = { version = "1", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


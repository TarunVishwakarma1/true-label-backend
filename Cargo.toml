[package]
name = "truelabel-backend"
version = "0.0.1"
edition = "2024"
description = "TrueLabel - Open-source barcode scanner with crowdsourced nutrition database"
repository = "https://github.com/TarunVishwakarma1/true-lable"
license = "Apache-2.0"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "compression-gzip", "compression-br", "timeout", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.26", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
] }
sqlx = { version = "0.9.0", features = ["postgres", "uuid", "chrono", "json", "runtime-tokio", "tls-rustls", "tls-rustls-ring"] }
redis = { version = "1.7.0", features = ["aio", "tokio-comp", "connection-manager", "tls-rustls-webpki-roots", "tokio-rustls-comp"] }
thiserror = "2.0.20"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
governor = "0.10.4"
jsonwebtoken = "9.3"
sha2 = "0.10"
# GitHub signs webhook deliveries with HMAC-SHA256 (`X-Hub-Signature-256`) —
# RustCrypto's sibling of the sha2 crate above, so this adds no new
# transitive dependencies. Verifying that signature by hand from raw sha2
# primitives is the kind of thing not worth hand-rolling.
hmac = "0.12"
rustls = { version = "0.23.44", features = ["ring"] }
# Dashboard admin accounts carry a real password, worth phishing unlike a
# device token, so it needs a slow, salted hash — not the sha2 digest used
# for tokens above.
argon2 = "0.5"
# argon2's default features pull in password-hash's `rand_core` re-export,
# but not `rand_core`'s own `getrandom` feature — without it `OsRng` isn't
# compiled in at all. Cargo unifies this shared dependency, so enabling it
# here is what makes `argon2::password_hash::rand_core::OsRng` exist.
password-hash = { version = "0.5", features = ["getrandom"] }

[dev-dependencies]
axum-test = "21.1.0"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
